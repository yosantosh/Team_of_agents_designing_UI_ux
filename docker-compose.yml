version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uiux
      POSTGRES_PASSWORD: uiux_dev_password
      POSTGRES_DB: uiux
    ports:
      - "5432:5432"
    volumes:
      - uiux_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uiux -d uiux"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: uiux
      MINIO_ROOT_PASSWORD: uiux_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - uiux_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      UIUX_HOST: "0.0.0.0"
      UIUX_PORT: "8765"
      UIUX_MODEL_BACKEND: "opencode"
      UIUX_CHECKPOINT_BACKEND: "postgres"
      UIUX_POSTGRES_DSN: "postgresql://uiux:uiux_dev_password@postgres:5432/uiux"
      UIUX_S3_BUCKET: "uiux-artifacts"
      UIUX_S3_ENDPOINT: "http://minio:9000"
      UIUX_S3_ACCESS_KEY: "uiux"
      UIUX_S3_SECRET_KEY: "uiux_dev_password"
    ports:
      - "8765:8765"
    volumes:
      - ./.runtime:/app/.runtime
      - ./artifacts:/app/artifacts
      - ./org:/app/org

volumes:
  uiux_pgdata:
  uiux_minio:
