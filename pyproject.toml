[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uiux-agent-company"
version = "0.1.0"
description = "A LangGraph-powered UI/UX agent company for native Android social apps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "langchain-core>=1,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pyyaml>=6",
  "jsonschema>=4",
  "typer>=0.12",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
uiux = "ui_ux_company.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ui_ux_company = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
