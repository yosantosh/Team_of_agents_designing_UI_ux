    outputs: [performance_report, gate_result]
    tools: [macrobenchmark, perfetto, gradle]
    gates: [performance_qa]
    kpis: [startup_ms, jank_pct, memory_mb, apk_mb]
    failure_modes: [flagship_only, no_baseline, ignored_regression]

  - id: security_privacy_reviewer
    title: "Security & Privacy Reviewer"
    tier: 4
    enabled: false
    prompt_key: security_privacy
    model: reasoner
    real_world_equivalent: "Security & Privacy Design Partner"
    mission: "Review permissions, PII, logging, secrets, data retention, prompt injection, supply chain, and Play policy implications."
    inputs: [screen_spec, data_flows, permissions, dependencies]
    outputs: [security_review, privacy_review, gate_result]
    tools: [static_analysis, secret_scan, policy_checklist]
    gates: [security_privacy]
    kpis: [critical_findings, permission_justification, secret_leaks]
    failure_modes: [afterthought_review, over_permission, pii_in_logs]

  - id: trust_safety_reviewer
    title: "Trust & Safety Reviewer"
    tier: 4
    enabled: false
    prompt_key: trust_safety
    model: reasoner
    real_world_equivalent: "Trust & Safety Product Partner"
    mission: "Review reporting/blocking, minors, harassment, content warnings, moderation UX, and regional policy for social surfaces."
    inputs: [screen_spec, user_flows, policy_requirements]
    outputs: [trust_safety_review, gate_result]
    tools: [policy_checklist, artifact_store]
    gates: [trust_safety]
    kpis: [safety_flow_coverage, report_completion, policy_conflicts]
    failure_modes: [missing_report_path, no_block_path, minor_risk]

  - id: release_manager
    title: "Release Manager"
    tier: 4
    enabled: true
    prompt_key: release_manager
    model: reasoner
    real_world_equivalent: "Android Release Manager"
    mission: "Assemble the release candidate, verify gates, define staged rollout and rollback, and own post-release monitoring."
    inputs: [qa_reports, evaluation, release_notes, rollout_plan]
    outputs: [release_candidate, rollout_plan, rollback_plan]
    tools: [git, ci, feature_flags, play_console_optional]
    gates: [release]
    kpis: [rollback_rate, crash_free, release_cycle_time]
    failure_modes: [unverified_release, no_rollback, big_bang_rollout]

  - id: analytics_experimentation_lead
    title: "Analytics & Experimentation Lead"
    tier: 4
    enabled: false
    prompt_key: analytics
    model: reasoner
    real_world_equivalent: "Data Science / Experimentation Lead"
    mission: "Define event taxonomy, funnels, guardrail metrics, A/B/n design, and post-launch readouts."
    inputs: [product_brief, screen_spec, success_metrics]
    outputs: [instrumentation_plan, experiment_plan, readout]
    tools: [analytics_optional, artifact_store]
    gates: [experiment_review]
    kpis: [metric_coverage, experiment_quality, decision_latency]
    failure_modes: [vanity_metrics, no_guardrails, underpowered_tests]

  - id: design_ops_librarian
    title: "Design Ops Librarian"
    tier: 5
    enabled: false
    prompt_key: design_ops
    model: reasoner
    real_world_equivalent: "Design Program Manager / Design Ops Lead"
    mission: "Own artifact taxonomy, research repository, templates, design debt, decision records, provenance, and onboarding."
    inputs: [all_artifacts, run_history, registry]
    outputs: [memory_entry, design_debt_register, index_update]
    tools: [artifact_store, registry, git]
    gates: [memory_review]
    kpis: [artifact_findability, decision_recall, debt_age]
    failure_modes: [artifact_sprawl, lost_decisions, stale_docs]

  - id: eval_red_team
    title: "Eval & Red Team"
    tier: 5
    enabled: false
    prompt_key: eval_red_team
    model: critic
    real_world_equivalent: "AI Quality / Red Team Lead"
    mission: "Build golden tasks, calibrate judges, run regressions, inject failures, test prompt injection, and score agents."
    inputs: [run_history, evals, traces, proposals]
    outputs: [eval_report, agent_scorecards, regression_alerts]
    tools: [langsmith_optional, eval_harness, artifact_store]
    gates: [eval_review]
