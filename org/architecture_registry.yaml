    inputs: [run_metrics, token_ledger, qa_reports, registry, eval_reports]
    outputs: [evolution_proposal, expected_impact, rollback_plan]
    tools: [registry, analytics, langsmith_optional]
    gates: [evolution_approval]
    kpis: [proposal_hit_rate, cost_saved, quality_delta]
    failure_modes: [change_for_change, self_approval, unmeasured_claims]

pods:
  - id: feed
    name: "Feed / Home"
    screens: [home_feed, post_card, story_bar, comments]
    primary_agents: [visual_ui_designer, compose_implementer, visual_qa_inspector]
    target_ui_hint: "High-density media feed; hierarchy within 0.5s; stable scroll."
  - id: profile
    name: "Profile / Identity"
    screens: [profile_header, media_grid, moments, edit_profile, followers]
    primary_agents: [visual_ui_designer, compose_implementer, visual_qa_inspector]
    target_ui_hint: "Identity-first; media categories; long usernames; empty grid."
  - id: messages
    name: "Messages / Chat"
    screens: [inbox, conversation, message_requests, composer, media_attachment]
    primary_agents: [visual_ui_designer, compose_implementer, functional_a11y_qa]
    target_ui_hint: "Realtime states, unread badges, keyboard/IME, offline queue."
  - id: create
    name: "Create / Publish"
    screens: [create_post, story_composer, reel_composer, audience_picker, upload_progress]
    primary_agents: [visual_ui_designer, compose_implementer, functional_a11y_qa]
    target_ui_hint: "Low-friction publish, permission rationale, progress/retry."
  - id: explore
    name: "Explore / Search"
    screens: [explore_grid, search_suggestions, results, filters, people_search]
    primary_agents: [visual_ui_designer, compose_implementer, visual_qa_inspector]
    target_ui_hint: "Visual discovery, query states, empty/error, content density."
  - id: notifications
    name: "Notifications"
    screens: [activity, notification_detail, badges, preferences]
    primary_agents: [visual_ui_designer, compose_implementer, functional_a11y_qa]
    target_ui_hint: "Scanability, grouping, unread state, red indicator-only rule."
  - id: onboarding
    name: "Onboarding / Auth / Settings"
    screens: [splash, login, signup, permissions, settings, privacy]
    primary_agents: [visual_ui_designer, compose_implementer, functional_a11y_qa]
    target_ui_hint: "Trust, clarity, permission timing, error recovery."
  - id: media_rooms
    name: "Media / Player / Rooms"
    screens: [mini_player, now_playing, queue, live_room, room_chat]
    primary_agents: [visual_ui_designer, compose_implementer, performance_qa]
    target_ui_hint: "Album-art liquid glass only exception; audio focus; background states."
  - id: safety
    name: "Safety / Moderation"
    screens: [report, block, mute, content_warning, appeal]
    primary_agents: [visual_ui_designer, compose_implementer, trust_safety_reviewer]
    target_ui_hint: "Clear consequences, reversible actions, vulnerable-user protection."

gates:
  - id: product_brief_review
    owner: product_analyst
    required: true
    sla_minutes: 1440
    pass_criteria: "Problem, users, success metrics, constraints, non-goals, and acceptance criteria are explicit."
  - id: ceo_review
    owner: ceo
    required: false
    sla_minutes: 240
    condition: "L4 autonomy, or a cross-tier / one-way-door decision."
    pass_criteria: "The CEO agent records a directive, constraints, and any escalation to the Dictator."
  - id: tier_1_review
    owner: discovery_lead
    required: true
    sla_minutes: 480
    pass_criteria: "Upstream criteria are complete, evidence-backed, and testable before design."
  - id: tier_2_review
    owner: design_lead
    required: true
    sla_minutes: 480
    pass_criteria: "Design contract is coherent and the critic has reviewed it."
  - id: tier_3_review
    owner: engineering_lead
    required: true
    sla_minutes: 480
    pass_criteria: "Implementation plan is buildable and shared-file changes are owned."
  - id: tier_4_review
    owner: quality_lead
    required: true
    sla_minutes: 240
    pass_criteria: "Real QA evidence exists and release blockers are explicit."
  - id: tier_5_review
    owner: meta_lead
    required: true
    sla_minutes: 1440
    pass_criteria: "Memory, eval, and evolution evidence is recorded."
  - id: design_critique
    owner: independent_design_critic
    required: true
    sla_minutes: 240
    pass_criteria: "Rubric: every blocker criterion scores >= 3/4; non-blocker findings are deferred. Max 2 rework cycles, then the design lead issues a binding disposition."
    rubric:
      scale: "0-4"
      blocker_min: 3
      max_rework: 2
      non_blocker_policy: "deferred_backlog"
      criteria:
        - single_primary_action
        - copy_quietness
        - layout_360dp
        - font_scale_200
        - state_coverage
  - id: human_design_approval
    owner: dictator
    required: true
    sla_minutes: 1440
    pass_criteria: "Dictator approves the design direction or explicitly overrides with a recorded rationale."
  - id: visual_qa
    owner: visual_qa_inspector
    required: true
    sla_minutes: 240
    pass_criteria: "All captured screens pass perceptual/pixel thresholds on the required device matrix; no critical clipping/overlap/contrast defects."
  - id: functional_a11y
    owner: functional_a11y_qa
    required: true
    sla_minutes: 240
    pass_criteria: "All critical flows pass; no critical a11y defects; 48dp targets; TalkBack labels; 200% font; offline/error states verified."
  - id: security_privacy
    owner: security_privacy_reviewer
    required: false
    sla_minutes: 240
    condition: "Feature touches permissions, PII, auth, payments, or external content."
  - id: trust_safety
    owner: trust_safety_reviewer
    required: false
    sla_minutes: 240
    condition: "Feature touches reporting, blocking, minors, moderation, or public content."
  - id: manager_evaluation
    owner: chief_orchestrator
    required: true
    sla_minutes: 120
    pass_criteria: "All required gates pass; evidence is present; budget and scope are within policy."
  - id: release
    owner: release_manager
    required: true
    sla_minutes: 240
    pass_criteria: "Release candidate, rollout plan, rollback plan, monitoring plan, and Dictator release approval exist."
  - id: evolution_approval
    owner: dictator
    required: true
    sla_minutes: 1440
    pass_criteria: "Dictator approves, rejects, or dictates the evolution proposal."

artifact_types:
  - product_brief
  - change_request
  - target_manifest
  - research_findings
  - android_constraints
  - user_flows
  - design_tokens
  - component_spec
  - screen_spec
  - design_critique
  - intent_packet
  - implementation_plan
  - code_patch
  - intent_coverage
  - visual_qa_report
  - functional_qa_report
  - a11y_report
  - performance_report
  - security_review
  - trust_safety_review
  - evaluation_report
  - release_candidate
  - learnings
  - evolution_proposal

evolution_policy:
  proposer: org_evolution_auditor
  approver: dictator
  shadow_eval_required: true
  canary_required: true
  rollback_required: true
  self_approval_forbidden: true
  immutable:
    - safety_policy
    - approval_policy
    - data_access_policy
    - release_authority
  mutable:
    - agent_enabled
    - model_alias
    - prompt_version
    - routing_weights
    - gate_thresholds
    - budget_caps
    - pod_composition
    - tool_allowlist

