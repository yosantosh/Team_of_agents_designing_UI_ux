    tier: 4
    enabled: false
    prompt_key: performance_qa
    model: reasoner
    real_world_equivalent: "Staff Android Performance Engineer"
    mission: "Verify startup, jank, memory, APK size, network behavior, Compose stability, and baseline profiles."
