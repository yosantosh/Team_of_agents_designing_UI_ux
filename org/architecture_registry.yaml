metrics:
  - id: first_pass_yield
    definition: "Runs that pass design critique and QA without rework / total runs"
    target: ">= 0.60"
  - id: rework_rate
    definition: "Rework loops per completed screen"
    target: "<= 1.0"
  - id: cycle_time
    definition: "Median wall-clock time from decree to release candidate"
    target: "trend down"
  - id: cost_per_screen
    definition: "Estimated token cost per approved screen"
    target: "trend down"
  - id: visual_defect_escape
    definition: "Visual defects found after release / released screens"
    target: "<= 0.05"
  - id: a11y_defect_escape
    definition: "Critical a11y defects found after release"
    target: "0"
  - id: human_override_rate
    definition: "Dictator overrides / approvals"
    target: "trend down but never zero"
  - id: budget_adherence
    definition: "Token spend within monthly cap"
    target: "100%"
